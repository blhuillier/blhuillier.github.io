- date: '2024-11-14'
  en: Discovery of an alignment between the small-scale jets of supermassive black holes and the orientation of their host galaxies, published in <a href="https://www.nature.com/articles/s41550-024-02407-4" target="_blank" rel="noopener noreferrer">Nature Astronomy</a>. See also the article in The Conversation <a href="https://theconversation.com/egg-shaped-galaxies-may-be-aligned-to-the-black-holes-at-their-hearts-astronomers-find-236699" target="_blank" rel="noopener noreferrer">Australia</a>, <a href="https://theconversation.com/decouverte-inattendue-dun-lien-entre-les-jets-des-trous-noirs-et-leurs-galaxies-hotes-237890" target="_blank" rel="noopener noreferrer">France</a> and <a href="https://theconversation.com/hallados-indicios-de-conexion-entre-agujeros-negros-y-sus-galaxias-239641" target="_blank" rel="noopener noreferrer">Spain</a>.
  fr: Découverte d’un alignement entre les jets à petite échelle des trous noirs supermassifs et l’orientation de leurs galaxies hôtes, publiée dans <a href="https://www.nature.com/articles/s41550-024-02407-4" target="_blank" rel="noopener noreferrer">Nature Astronomy</a>. Voir aussi les articles de The Conversation <a href="https://theconversation.com/decouverte-inattendue-dun-lien-entre-les-jets-des-trous-noirs-et-leurs-galaxies-hotes-237890" target="_blank" rel="noopener noreferrer">France</a>, <a href="https://theconversation.com/egg-shaped-galaxies-may-be-aligned-to-the-black-holes-at-their-hearts-astronomers-find-236699" target="_blank" rel="noopener noreferrer">Australie</a> et <a href="https://theconversation.com/hallados-indicios-de-conexion-entre-agujeros-negros-y-sus-galaxias-239641" target="_blank" rel="noopener noreferrer">Espagne</a>.
  ko: '초대질량 블랙홀의 작은 규모 제트와 모은하의 방향 사이에 정렬이 있음을 발견해 <a href="https://www.nature.com/articles/s41550-024-02407-4" target="_blank" rel="noopener noreferrer">Nature Astronomy</a>에 발표했습니다. The Conversation 기사: <a href="https://theconversation.com/egg-shaped-galaxies-may-be-aligned-to-the-black-holes-at-their-hearts-astronomers-find-236699" target="_blank" rel="noopener noreferrer">호주</a>, <a href="https://theconversation.com/decouverte-inattendue-dun-lien-entre-les-jets-des-trous-noirs-et-leurs-galaxies-hotes-237890" target="_blank" rel="noopener noreferrer">프랑스</a>, <a href="https://theconversation.com/hallados-indicios-de-conexion-entre-agujeros-negros-y-sus-galaxias-239641" target="_blank" rel="noopener noreferrer">스페인</a>.'
