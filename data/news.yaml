  en: '<a href="/the-group/#hyeon">Hyeon Kim</a>&#x27;s paper on the non-parametric estimation of the baryon gas fraction and the cosmological bias with clusters was submitted: <a href="https://arxiv.org/abs/2603.13763" target="_blank" rel="noopener noreferrer">arXiv:2603.13763</a>.'
