  en: The <a href="https://lfseoul.org/en/" target="_blank" rel="noopener noreferrer">Lycée Français de Séoul</a> team I mentored won 3rd prize and the Prix de la Société Française d&#x27;Acoustique at the final of the 33rd Olympiades de Physique France, with the project « Voir (plus) rouge… mène au côté obscur de la force ! ». <a href="https://pr.sejong.ac.kr/news/people/faculty.do?mode=view&amp;articleNo=863364" target="_blank" rel="noopener noreferrer">Sejong University press release</a>
  fr: L’équipe du <a href="https://lfseoul.org/en/" target="_blank" rel="noopener noreferrer">Lycée Français de Séoul</a> que j’ai encadrée a remporté le 3ᵉ prix et le prix de la Société Française d’Acoustique à la finale des 33ᵉ Olympiades de Physique France, avec le projet « Voir (plus) rouge… mène au côté obscur de la force ! ». <a href="https://pr.sejong.ac.kr/news/people/faculty.do?mode=view&amp;articleNo=863364" target="_blank" rel="noopener noreferrer">Communiqué de presse de l’Université Sejong</a>
  ko: '제가 지도한 <a href="https://lfseoul.org/en/" target="_blank" rel="noopener noreferrer">서울프랑스학교(Lycée Français de Séoul)</a> 팀이 제33회 프랑스 물리 올림피아드(Olympiades de Physique France) 결선에서 3등상과 프랑스 음향학회상을 받았습니다. 프로젝트: « Voir (plus) rouge… mène au côté obscur de la force ! ». <a href="https://pr.sejong.ac.kr/news/people/faculty.do?mode=view&amp;articleNo=863364" target="_blank" rel="noopener noreferrer">세종대학교 보도자료</a>'
