# Labels for the papers in papers.yaml (field "labels").
# Optional "image": background of the label page header. Optional intro text: label-intros/<id>[.fr|.ko].html
# Each label gets a page /labels/<id>/ (also /fr/ and /ko/) and a chip on the Publications page.
# "first-author" and "students" are set automatically from the author list
# (first author L'Huillier; any author marked †): don't add them by hand.
- id: selection
  en: Selection
  fr: Sélection
  ko: 선별
  labels:
  - { id: key-papers, en: Key papers, fr: Articles clés, ko: 주요 논문 }
