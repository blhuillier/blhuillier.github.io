{{- /* All labels, grouped, with paper counts. Context: (dict "active" "<label id or empty>") */ -}}
{{- $lang := site.Language.Lang -}}
{{- $counts := dict -}}
{{- range site.Data.papers -}}
  {{- range partial "paperlabels.html" . -}}
    {{- $counts = merge $counts (dict . (add (index $counts . | default 0) 1)) -}}
  {{- end -}}
{{- end -}}
<nav class="label-bar" aria-label="{{ i18n "labels_aria" }}">
{{- range $g := site.Data.labels }}
<div class="label-bar__group">
<span class="label-bar__heading">{{ index $g $lang | default $g.en }}</span>
{{- range $g.labels }}{{ $n := index $counts .id | default 0 }}{{ if $n }}{{ with site.GetPage (printf "/labels/%s" .id) }}
<a class="label-chip label-chip--{{ $g.id }}{{ if eq $.active .Params.label }} is-active{{ end }}" href="{{ .RelPermalink }}" data-label="{{ .Params.label }}"{{ if eq $.active .Params.label }} aria-current="page"{{ end }}>{{ .Title }} <span class="label-chip__n">{{ $n }}</span></a>
{{- end }}{{ end }}{{ end }}
</div>
{{- end }}
</nav>
