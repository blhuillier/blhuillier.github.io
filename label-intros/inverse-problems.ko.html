<p>우주론의 많은 물리량은 적분을 거쳐서만 관측됩니다. 예를 들어 중력렌즈 자료는 물질 파워 스펙트럼에 기하학적 커널이 합성곱된 양을 측정합니다. 그 아래의 함수를 복원하는 일은 잡음에 민감한 비적정(ill-posed) 역문제입니다.</p>
<p>J.-Q. Jiang, A. Dawn, D. K. Hazra, A. Shafieloo와 함께, 수정·정칙화된 Richardson–Lucy 디컨볼루션으로 CMB 렌즈 효과와 3×2pt 측정(은하 군집, 은하–은하 렌즈, 우주 시어)으로부터 물질 파워 스펙트럼을 그 형태를 가정하지 않고 재구성합니다.</p>
